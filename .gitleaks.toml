# Configuration for the secret scan workflow (.github/workflows/secret-scan.yml).
# The default gitleaks rules stay on; only the made-up passwords of the test
# servers and test fixtures are allowed, each spelled out. Never add a real
# secret here: a leaked secret has to be replaced, not allowed.

[extend]
useDefault = true

[[allowlists]]
description = "Made-up passwords of test servers and test fixtures"
regexes = [
  '''^katzenpfote-123$''',
  '''^Kirschbluete-Tastatur(-42!?)?$''',
  '''^Seifenblase-Wanderweg(-17!?)?$''',
  '''^geheim-und-lang$''',
  '''^ein-ganz-neues-passwort-17$''',
  '''^ein-langes-passwort-123$''',
  '''^0123456789abcdef0123$''',
  '''^scrape-me-gently-0123456789$''',
  # Old mailbox passwords in the tests of the admin's moves.
  '''^altes-umzug-passwort$''',
  '''^neues-passwort$''',
  # The API key of the fake AI provider in the assistant's tests.
  '''^sk-test-abcdefgh1234$''',
  # A made-up sign-in flow id in the portal's tests.
  '''^Abc_def-12345678$''',
  # The OAUTHBEARER example token of RFC 7628, section 4.1.
  '''^vF9dft4qmTc2Nvb3RlckBhbHRhdmlzdGEuY29tCg==$''',
  # Not a secret: the letters the portal draws metrics tokens from.
  '''^abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789$''',
]
