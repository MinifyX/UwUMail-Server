# UwUMail Server
#
#   1. cp .env.example .env   and fill in your host name
#   2. docker compose up -d
#   3. docker compose logs uwumail | grep "one-time code"
#   4. open https://<your host name>/setup and enter the code
#
# The whole way, with DNS and the gateway: docs/install.md. Reverse proxies and every DNS
# record: docs/deployment.md.

services:
  uwumail:
    image: ghcr.io/minifyx/uwumail-server:${UWUMAIL_VERSION:-latest}
    container_name: uwumail
    restart: unless-stopped
    hostname: ${UWUMAIL_HOSTNAME:?set UWUMAIL_HOSTNAME in .env}
    environment:
      UWUMAIL_HOSTNAME: ${UWUMAIL_HOSTNAME}
      UWUMAIL_TLS__ACME_EMAIL: ${UWUMAIL_ACME_EMAIL:-}
      UWUMAIL_TONE__LANGUAGE: ${UWUMAIL_LANGUAGE:-de}
    ports:
      - "25:25"     # mail from other servers
      - "80:80"     # certificate challenges, redirects to HTTPS
      - "443:443"   # web (portal and JMAP)
      - "465:465"   # mail apps, TLS
      - "993:993"   # mail apps, IMAP with TLS
      - "587:587"   # mail apps, STARTTLS
    volumes:
      - uwumail-data:/data
    stop_grace_period: 20s
    # Hardening: the server runs as an unprivileged user (uid 10001) on a read-only root file
    # system; only the data volume and a small /tmp are writable. Every Linux capability is
    # dropped except NET_BIND_SERVICE, which the binary needs to bind the low mail and web ports.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  uwumail-data:
