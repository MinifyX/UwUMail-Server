# UwUMail Server
#
# install.sh sets all of this up for you. By hand it is:
#
#   1. cp .env.example .env   and fill in your host name
#   2. docker compose up -d
#   3. docker compose logs uwumail | grep "one-time code"
#   4. open https://<your host name>/setup and enter the code
#
# The next version: update.sh, next to this file.
#
# With a UwUMail Gateway, its pairing code goes into .env before the first start. When something
# else on this machine already holds one of the ports, .env moves UwUMail's; install.sh asks
# about that by itself.
#
# The whole way, with DNS and the gateway: docs/install.md. Reverse proxies and every DNS
# record: docs/deployment.md.

services:
  uwumail:
    image: ghcr.io/minifyx/uwumail-server:${UWUMAIL_VERSION:-latest}
    container_name: uwumail
    restart: unless-stopped
    hostname: ${UWUMAIL_HOSTNAME:?set UWUMAIL_HOSTNAME in .env}
    environment:
      UWUMAIL_HOSTNAME: ${UWUMAIL_HOSTNAME}
      UWUMAIL_TLS__ACME_EMAIL: ${UWUMAIL_ACME_EMAIL:-}
      UWUMAIL_TONE__LANGUAGE: ${UWUMAIL_LANGUAGE:-de}
      UWUMAIL_GATEWAY__CODE: ${UWUMAIL_GATEWAY_CODE:-}
      # Empty leaves the VPN and proxy to the portal (Settings -> VPN & proxy).
      UWUMAIL_EGRESS__PROXY: ${UWUMAIL_EGRESS_PROXY:-}
      UWUMAIL_EGRESS__FALLBACK: ${UWUMAIL_EGRESS_FALLBACK:-}
    # Every one of these can be moved in .env, as a port or as address:port, for a machine where
    # something else already holds one of them. Only where UwUMail listens moves: from the
    # outside the numbers stay, because other mail servers only ever try 25 and mail apps expect
    # 465, 587 and 993, so the router or the firewall in front has to do the translating.
    ports:
      - "${UWUMAIL_SMTP_BIND:-25}:25"            # mail from other servers
      - "${UWUMAIL_HTTP_BIND:-80}:80"            # certificate challenges, redirects to HTTPS
      - "${UWUMAIL_HTTPS_BIND:-443}:443"         # web (portal and JMAP)
      - "${UWUMAIL_SUBMISSIONS_BIND:-465}:465"   # mail apps, TLS
      - "${UWUMAIL_IMAPS_BIND:-993}:993"         # mail apps, IMAP with TLS
      - "${UWUMAIL_SUBMISSION_BIND:-587}:587"    # mail apps, STARTTLS
      - "${UWUMAIL_MANAGESIEVE_BIND:-4190}:4190" # mail rules (ManageSieve, STARTTLS); optional
    volumes:
      - uwumail-data:/data
    stop_grace_period: 20s
    # Hardening: the server runs as an unprivileged user (uid 10001) on a read-only root file
    # system; only the data volume and a small /tmp are writable. Every Linux capability is
    # dropped except NET_BIND_SERVICE, which the binary needs to bind the low mail and web ports.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # The virus scanner. It stays out of the way until you ask for it:
  #
  #   docker compose --profile antivirus up -d
  #
  # It wants about a gigabyte of memory (plan for two), and its first start takes a few minutes
  # while it fetches its signatures. Afterwards switch it on in the portal under
  # Spam filter → Viruses; the server reaches it as clamav:3310 and nothing outside this
  # machine can. COMPOSE_PROFILES=antivirus in .env brings it along with every up -d.
  # The whole story: docs/antivirus.md.
  clamav:
    image: clamav/clamav:1.5_base-debian13-slim
    container_name: uwumail-clamav
    profiles:
      - antivirus
    restart: unless-stopped
    volumes:
      - uwumail-clamav:/var/lib/clamav
    expose:
      - "3310"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  # A VPN for the remote pictures in messages, so their senders see the VPN instead of this
  # server. The portal can send update checks and fetching from other mailboxes through it too;
  # mail delivery, DNS and everything else leave as before.
  #
  # Easiest: set it up in the portal under Settings -> VPN & proxy. With the machine's helper
  # (deploy/host) the portal writes .env.vpn and starts this container itself. By hand:
  #
  #   cp .env.vpn.example .env.vpn   and fill in your VPN (NordVPN, WireGuard, OpenVPN, ...)
  #   docker compose --profile vpn up -d
  #   and in the portal: Settings -> VPN & proxy -> proxy http://gluetun:8888
  #
  # COMPOSE_PROFILES=vpn in .env brings it along with every up -d. The whole story:
  # "Remote pictures through a VPN" in docs/configuration.md.
  gluetun:
    image: qmcgaw/gluetun:v3.41
    container_name: uwumail-vpn
    profiles:
      - vpn
    restart: unless-stopped
    env_file:
      - path: .env.vpn
        required: false
    environment:
      # The proxy the server fetches through; reachable only from the containers next to it.
      HTTPPROXY: "on"
      HTTPPROXY_STEALTH: "on"
    expose:
      - "8888"
    volumes:
      # A provider's own .ovpn file, when the portal was given one.
      - ./vpn:/gluetun/custom:ro
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  uwumail-data:
  uwumail-clamav:
