[package]
name = "uwumail-jmap"
description = "JMAP (RFC 8620, 8621, 9610, JMAP Calendars) for the UwUMail server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uwumail-smtp.workspace = true
uwumail-store.workspace = true

ammonia.workspace = true
# Web Push: message encryption (RFC 8291) and the server's VAPID signature (RFC 8292).
aws-lc-rs.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
# iCalendar <-> JSCalendar for JMAP Calendars, vCard <-> JSContact for JMAP Contacts.
calcard = { workspace = true, features = ["jmap"] }
chrono.workspace = true
chrono-tz.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
# Pictures made ready for OCR (docs/jmap-image-text.md): their size, shrunk and grey.
image.workspace = true
mail-builder.workspace = true
mail-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `process`: Tesseract for OCR runs as a program of its own.
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true

[dev-dependencies]
uwumail-dav.workspace = true
tempfile.workspace = true
tower.workspace = true
tokio-tungstenite.workspace = true
