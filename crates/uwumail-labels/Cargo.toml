[package]
name = "uwumail-labels"
description = "Labels without a model: rules, detectors, learned senders and a naive Bayes classifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Self-contained on purpose: the UwUMail client copies this crate as it is for the labels of its
# other accounts (docs/labels.md), so it depends on no other uwumail crate. mail-parser only reads
# a raw message for `Mail::parse`.
[dependencies]
mail-parser = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
default = ["parse"]
parse = ["dep:mail-parser"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
