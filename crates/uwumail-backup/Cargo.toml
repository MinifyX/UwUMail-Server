[package]
name = "uwumail-backup"
description = "Deduplicated, encrypted backups of a UwUMail server to SFTP, S3 or a folder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uwumail-store.workspace = true

aws-lc-rs.workspace = true
bytes.workspace = true
data-encoding.workspace = true
fastcdc = "5"
flate2 = "1"
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rusqlite = { workspace = true, features = ["limits"] }
rustls.workspace = true
russh = { version = "0.63", default-features = false, features = ["aws-lc-rs", "flate2"] }
russh-sftp = "3"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
webpki-roots.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
hyper = { workspace = true, features = ["server"] }
