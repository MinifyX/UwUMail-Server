name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/minifyx/uwumail-server

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Smoke script syntax
        run: node --check dev/smoke.mjs

  image:
    name: Container image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Skip for documentation-only changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse -q --verify HEAD^ >/dev/null || git diff --name-only HEAD^ HEAD | grep -qvE '^(docs/|brand/|README|CONTRIBUTING|SECURITY|\.github/ISSUE)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.build == 'true'
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - name: Cross compiler for arm64
        if: steps.changes.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.build == 'true'
        with:
          key: release
      - name: Build amd64
        if: steps.changes.outputs.build == 'true'
        run: cargo build --release --locked -p uwumail-server --target x86_64-unknown-linux-gnu
      - name: Build arm64
        if: steps.changes.outputs.build == 'true'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked -p uwumail-server --target aarch64-unknown-linux-gnu
      - name: Collect binaries
        if: steps.changes.outputs.build == 'true'
        run: |
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-gnu/release/uwumail-server dist/amd64/
          cp target/aarch64-unknown-linux-gnu/release/uwumail-server dist/arm64/
      - uses: docker/setup-qemu-action@v3
        if: steps.changes.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.changes.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: steps.changes.outputs.build == 'true'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.build == 'true'
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image starts
        if: steps.changes.outputs.build == 'true'
        run: |
          docker run --rm "${IMAGE}:sha-$(git rev-parse --short=7 HEAD)" --version
