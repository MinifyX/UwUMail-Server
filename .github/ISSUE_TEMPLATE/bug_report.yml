name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Bugs get fixed, best effort and without guaranteed response times.
        Please leave out real addresses, passwords and mail contents; use example.com names instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the admin portal's overview, or `uwumail-server --version`.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: How is it installed?
      placeholder: install.sh / own compose file / other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines only, with addresses and tokens removed.
      render: text
