[workspace]
resolver = "3"
members = [
    "crates/uwumail-store",
    "crates/uwumail-assist",
    "crates/uwumail-smtp",
    "crates/uwumail-imap",
    "crates/uwumail-dav",
    "crates/uwumail-jmap",
    "crates/uwumail-web",
    "crates/uwumail-server",
    "crates/uwumail-tunnel",
    "crates/uwumail-gateway",
    "crates/uwumail-backup",
    "crates/uwumail-tnef",
]

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/MinifyX/UwUMail-Server"
rust-version = "1.89"

[workspace.dependencies]
uwumail-assist = { path = "crates/uwumail-assist" }
uwumail-backup = { path = "crates/uwumail-backup" }
uwumail-dav = { path = "crates/uwumail-dav" }
uwumail-gateway = { path = "crates/uwumail-gateway" }
uwumail-imap = { path = "crates/uwumail-imap" }
uwumail-jmap = { path = "crates/uwumail-jmap" }
uwumail-smtp = { path = "crates/uwumail-smtp" }
uwumail-store = { path = "crates/uwumail-store" }
uwumail-tnef = { path = "crates/uwumail-tnef" }
uwumail-tunnel = { path = "crates/uwumail-tunnel" }
uwumail-web = { path = "crates/uwumail-web" }

ammonia = "4"
anyhow = "1"
argon2 = { version = "0.6", features = ["getrandom"] }
# Only to check password hashes taken over from other mail servers, e.g. mailcow's BLF-CRYPT.
bcrypt = "0.19"
# prebuilt-nasm: Windows builds need no NASM, like rustls already arranges when it is part of the build.
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "query"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
# Text of TNEF (winmail.dat) in Windows code pages; the version mail-parser uses.
encoding_rs = "0.8"
futures-util = "0.3"
# Packing the TLS reports this server sends; the version mail-auth uses.
flate2 = "1"
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
# The same version mail-auth uses; "recursor" resolves from the root servers for DNS checks, and
# "dnssec-aws-lc-rs" validates answers for DANE (mail-auth switches it on as well).
hickory-resolver = { version = "0.26", default-features = false, features = [
    "tokio",
    "recursor",
    "system-config",
    "dnssec-aws-lc-rs",
] }
hyper = "1"
# Link hosts in spam checks: turning punycode back into the letters a reader sees.
idna = "1"
# Profile pictures: what people upload (PNG, JPEG, WebP, a GIF's first frame) is decoded within limits
# and written anew, without anything else the file carried.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# HTTPS requests to DNS provider APIs (Cloudflare).
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "aws-lc-rs"] }
http-body-util = "0.1"
bytes = "1"
# iCalendar and vCard for CalDAV and CardDAV: checking what clients store and when events happen.
calcard = { version = "0.3", default-features = false }
# Local times and time zones of calendar events for JMAP Calendars; the versions calcard uses.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service", "client-legacy", "http1"] }
instant-acme = { version = "0.8", features = ["rcgen"] }
# Portal and mail logins checked against an LDAP directory (docs/login-oidc-ldap.md), over rustls.
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
mail-auth = "0.13"
mail-builder = "1"
mail-parser = "0.11"
# Fast substring search: boundaries in the MIME structure check, links in the spam filter.
memchr = "2"
# MalwareBazaar lists attachments by their MD5 or SHA-256.
md-5 = "0.11"
# The public suffix list, so a sender picture is asked of `shop.example` and never of `news.mail.shop.example`.
psl = "2"
# The small PNG of the `Face:` header, written with a palette of as few colours as it takes to fit.
png = "0.18"
# QR codes for setting up authenticator apps, as plain modules the portal draws itself.
qrcode = { version = "0.14", default-features = false }
# WebDAV request bodies; the same version mail-auth uses.
quick-xml = "0.42"
getrandom = "0.4"
# QUIC for the tunnel between a server and its UwUMail Gateway, on the same rustls and aws-lc-rs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# Word lists: words and Rspamd-style regular expressions, matched in linear time.
regex = "1.13"
# The engine under `regex`, used directly where the memory a compiled set takes has to be known.
regex-automata = { version = "0.4", default-features = false, features = [
    "std",
    "syntax",
    "meta",
    "nfa-pikevm",
    "nfa-backtrack",
    "hybrid",
    "dfa-onepass",
    "perf-inline",
    "perf-literal",
    "unicode",
] }
# Built-in lists come packed with zstd; only unpacking is needed, in plain Rust.
ruzstd = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = "1"
# The system's certificate authorities as well, for an LDAP directory behind an organisation's own CA.
rustls-native-certs = "0.8"
# Free disk space for the health overview.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Sieve mail rules (RFC 5228 and extensions), compiled and run in-process; AGPL-3.0-only like this server.
sieve-rs = "1.0.2"
smtp-proto = "0.2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tower = "0.5"
# WebSocket client for the JMAP WebSocket tests.
tokio-tungstenite = "0.29"
tracing = "0.1"
# Links in mail for spam checks, parsed the way browsers do.
url = "2"
webpki-roots = "1"
x509-parser = "0.18"
# The file names inside zip attachments for spam checks; no compression needed to read them. The same
# version and features mail-auth uses for reports.
zip = { version = "8.5", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Test-only helpers
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Debug builds (and so the test binaries) keep line numbers for backtraces but no full debug
# info, and none at all for dependencies: that keeps target/ a few times smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Password hashing is slow on purpose, and unoptimised it is slower still: tests that log in
# would spend most of their time in it, and wait for each other at the server's limit on
# password checks running at once.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Scaling and re-encoding profile pictures is all arithmetic over pixels; unoptimised, a test that
# uploads one picture waits seconds for it.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
