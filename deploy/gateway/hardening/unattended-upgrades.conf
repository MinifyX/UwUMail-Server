// Security updates install themselves on a UwUMail Gateway. install.sh puts this into
// /etc/apt/apt.conf.d/, where the number 52 puts it after the distribution's own 50unattended-
// upgrades, so these lines win.
//
// Only the security pocket, and never a restart: a VPS with an open port 25 and a three-week-old
// OpenSSL is the bigger risk, but a machine that reboots itself in the middle of a delivery is not
// what anyone asked for. When a restart is needed, the portal and the login message say so.

Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
        "${distro_id}ESMApps:${distro_codename}-apps-security";
        "${distro_id}ESM:${distro_codename}-infra-security";
};

// Left to you. /var/run/reboot-required is what the report reads.
Unattended-Upgrade::Automatic-Reboot "false";

// A package whose new version asks a question would otherwise hold the machine up forever.
Unattended-Upgrade::MinimalSteps "true";
Dpkg::Options {
        "--force-confdef";
        "--force-confold";
};

APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
