# Kernel settings for a UwUMail Gateway. install.sh puts this into /etc/sysctl.d/.
# Nothing exotic: the machine faces the open internet on six ports, and these are the settings that
# keep it from taking part in things that are not its job.

# Port 25 is open to everyone, so the gateway meets SYN floods sooner or later.
net.ipv4.tcp_syncookies = 1

# The gateway carries connections through the tunnel, one socket at a time. It never routes
# packets, so nothing here should look like a router.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Packets claiming to come from somewhere they cannot have come from.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Not a router, so no router advertisements either. Left alone when the provider hands out IPv6 by
# advertisement: install.sh only writes these two when this machine's IPv6 does not depend on them.
# net.ipv6.conf.all.accept_ra = 0

# Do not answer broadcast pings for a stranger who forged the sender.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Addresses that tried something show up in the journal, where fail2ban reads them.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
