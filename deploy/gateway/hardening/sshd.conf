# SSH on a UwUMail Gateway. install.sh puts this into /etc/ssh/sshd_config.d/, where it is read
# before the main file, and checks it with `sshd -t` before reloading: a VPS locked out by its own
# config file is a VPS gone.
#
# What is deliberately NOT here: PasswordAuthentication and PermitRootLogin. Turning password
# logins off is the single biggest thing you can do for this machine — fail2ban only slows guessing
# down, keys end it — but doing it behind your back could lock you out of a machine that has no
# console. install.sh says so after every run instead, and leaves the decision to you.

# Three tries per connection, not six: fail2ban counts connections, so this quarters what a
# guesser gets per ban.
MaxAuthTries 3
# A connection that has not logged in by then is not going to.
LoginGraceTime 30s

# Nobody runs a graphical program on a gateway, and nobody builds a VPN through one.
X11Forwarding no
PermitTunnel no
# TCP forwarding stays on: `ssh -L` onto the gateway is how you look at a port from your desk, and
# turning it off would buy nothing from someone who already has a shell here.
