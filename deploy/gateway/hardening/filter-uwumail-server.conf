# The filter for the `uwumail-server` jail, which reads nothing.
#
# fail2ban only takes an address into a jail that exists, and a jail only exists with a filter. The
# addresses in this one never come from a log: the UwUMail server asks for them over the tunnel,
# and the helper hands each one to fail2ban-client. So this pattern is written never to match.
[Definition]
failregex = ^this jail reads no log, its bans come from the UwUMail server: <HOST>$
ignoreregex =
