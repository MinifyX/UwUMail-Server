# UwUMail Server next to an existing mail server (e.g. Mailcow) and web reverse proxy.
#
# The existing mail server keeps port 25 and forwards one (sub)domain here,
# a reverse proxy (e.g. Caddy) forwards the web host name to port 8080,
# and outgoing mail leaves through an existing relay.
#
#   1. Copy this folder to the server, e.g. /opt/uwumail
#   2. Fill in uwumail.toml
#   3. Create .env with:  RELAY_PASSWORD=...
#      and, to keep port 8080 to the reverse proxy, UWUMAIL_PROXY_BIND (see the ports below)
#   4. docker compose up -d
#
# See docs/deployment.md, section "Next to an existing mail server".

services:
  uwumail:
    image: ghcr.io/minifyx/uwumail-server:${UWUMAIL_VERSION:-latest}
    container_name: uwumail
    restart: unless-stopped
    environment:
      UWUMAIL_CONFIG: /etc/uwumail/uwumail.toml
      UWUMAIL_DELIVERY__RELAY__PASSWORD: ${RELAY_PASSWORD:?set RELAY_PASSWORD in .env}
    ports:
      - "25:25"       # mail forwarded by the existing mail server
      - "465:465"     # mail apps, TLS
      - "993:993"     # mail apps, IMAP with TLS
      - "587:587"     # mail apps, STARTTLS
      # Web, behind the reverse proxy. This port is plain HTTP: whoever reaches it gets the portal
      # without TLS. Give it only to the proxy, with UWUMAIL_PROXY_BIND in .env: 127.0.0.1:8080
      # when the proxy runs on this machine itself (not in Docker), else this machine's address in
      # the network the proxy comes from, e.g. 192.0.2.30:8080. A proxy in Docker on this machine
      # does not reach 127.0.0.1: put both on one Docker network and point it at uwumail:8080, like
      # the networks part of deploy/behind-proxy/compose.proxy.yaml; this port is then not needed.
      # Docker publishes ports past a host firewall like ufw, so "only the proxy may connect"
      # belongs into the network's firewall or the DOCKER-USER chain.
      - "${UWUMAIL_PROXY_BIND:-8080}:8080"
      - "443:443"     # web, straight from your own network (do not forward from the internet)
    volumes:
      - ./uwumail.toml:/etc/uwumail/uwumail.toml:ro
      - data:/data
    stop_grace_period: 20s
    # Hardening: the server runs as an unprivileged user (uid 10001) on a read-only root file
    # system; only the data volume and a small /tmp are writable. Every Linux capability is
    # dropped except NET_BIND_SERVICE, which the binary needs to bind the low mail and web ports.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  data:
